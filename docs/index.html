<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smartstake Live Data</title>
  <meta name="description" content="Live readings from printed ion-selective electrode sensors.">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <div>
        <h1 id="title">Smartstake live data</h1>
        <p class="lede">Printed nitrate sensors, streaming live.</p>
      </div>
      <div class="status" id="status" role="status">
        <span class="status-icon" id="status-icon" aria-hidden="true"></span>
        <span id="status-text">Loading…</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="segmented" role="group" aria-label="Time range" id="range-buttons"></div>
      <div class="segmented" role="group" aria-label="Show" id="mode-buttons"></div>
      <label class="unit-picker" id="unit-picker">Units
        <select id="unit-select"></select>
      </label>
      <span class="updated" id="updated"></span>
      <button type="button" class="button" id="download">Download CSV</button>
    </div>

    <p class="banner" id="banner" hidden></p>

    <section class="tiles" id="tiles" aria-label="Latest values"></section>

    <section>
      <h2 id="pair-heading">Potential</h2>
      <div class="grid" id="pair-charts"></div>
    </section>

    <details class="cal">
      <summary>Calibration</summary>
      <p class="section-note">E = E<sub>0</sub> + S·log<sub>10</sub>(C / mM), with E the logger reading in mV.</p>
      <div class="card table-card">
        <table id="cal-table">
          <thead>
            <tr>
              <th scope="col">Pair</th>
              <th scope="col" class="num">E<sub>0</sub>, mV</th>
              <th scope="col" class="num">Slope, mV/decade</th>
              <th scope="col" class="num">Latest</th>
              <th scope="col" class="num" id="cal-conc-head">Concentration</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="cal-actions">
        <button type="button" class="button" id="cal-copy">Copy for config.js</button>
        <button type="button" class="button" id="cal-reset">Reset</button>
        <span class="cal-msg" id="cal-msg" role="status"></span>
      </div>
      <pre class="snippet" id="cal-snippet" hidden></pre>
    </details>
  </div>
</body>
</html>
