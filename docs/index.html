<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smartstake Live Data</title>
  <meta name="description" content="Live readings from printed ion-selective electrode sensors.">
  <link rel="stylesheet" href="style.css?v=5">
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <div>
        <h1 id="title">Smartstake live data</h1>
        <p class="lede">Printed nitrate sensors, streaming live.</p>
      </div>
      <div class="status" id="status" role="status">
        <span class="status-icon" id="status-icon" aria-hidden="true"></span>
        <span id="status-text">Loading…</span>
      </div>
    </header>

    <div class="toolbar">
      <label class="unit-picker">Units
        <select id="unit-select"></select>
      </label>
      <span class="updated" id="updated"></span>
      <button type="button" class="button" id="reset">Reset plot</button>
      <button type="button" class="button" id="download">Download CSV</button>
    </div>

    <p class="banner" id="banner" hidden></p>

    <section class="tiles" id="tiles" aria-label="Latest values"></section>

    <section class="grid" id="charts" aria-label="Average nitrate"></section>

    <details class="cal">
      <summary>Calibration</summary>
      <p class="section-note">E = E<sub>0</sub> + S·log<sub>10</sub>(C / mM), E in logger mV. Reset plot sets every channel to 60 mV/decade and 20 ppm NO₃⁻-N at its latest reading. Checked channels are averaged.</p>
      <div class="card table-card">
        <table id="cal-table">
          <thead>
            <tr>
              <th scope="col">Use</th>
              <th scope="col">Channel</th>
              <th scope="col" class="num">E<sub>0</sub>, mV</th>
              <th scope="col" class="num">Slope, mV/decade</th>
              <th scope="col" class="num">Latest</th>
              <th scope="col" class="num" id="cal-conc-head">Nitrate</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </div>
</body>
</html>
